name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Play upload key (if the repo secrets are set)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "HAS_UPLOAD_KEY=1" >> "$GITHUB_ENV"
          else
            echo "No upload key secrets yet: the Play bundle is skipped."
          fi

      - name: Build test APK and Play bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_UPLOAD_KEY" = "1" ]; then
            ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease
            cp app/build/outputs/bundle/playRelease/app-play-release.aab AlgoAliWalls-play.aab
          else
            # No key in this repo's secrets: build an unsigned bundle; it is signed with the upload key outside CI.
            ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease
            cp app/build/outputs/bundle/playRelease/app-play-release.aab AlgoAliWalls-play-unsigned.aab
          fi
          cp app/build/outputs/apk/github/release/app-github-release.apk AlgoAliWalls.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlgoAliWalls
          path: |
            AlgoAliWalls.apk
            AlgoAliWalls-play*.aab
          if-no-files-found: warn

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="AlgoAliWalls.apk"
          for f in AlgoAliWalls-play.aab AlgoAliWalls-play-unsigned.aab; do [ -f "$f" ] && FILES="$FILES $f"; done
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES \
            --title "Algo Ali Walls (build ${{ github.run_number }})" \
            --notes "AlgoAliWalls.apk: test version for your phone (everything unlocked). AlgoAliWalls-play.aab: upload this to Google Play Console." \
            --latest
